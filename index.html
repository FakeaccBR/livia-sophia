<!-- 1. Importar as bibliotecas do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>

    <script>
        // 2. COLE AQUI O SEU FIREBASE CONFIG (substitua pelo que copiou no Passo 3)
        const firebaseConfig = {
  apiKey: "AIzaSyANDE-OWfExJcgAM_3ygvN6320qW2V40tM",
  authDomain: "liviasophia.firebaseapp.com",
  projectId: "liviasophia",
  storageBucket: "liviasophia.firebasestorage.app",
  messagingSenderId: "597364587709",
  appId: "1:597364587709:web:7242d3a32475f4adb10bd4",
  measurementId: "G-Q5YEG7NBZ2"
};
        };

        // 3. Inicializar o Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 4. Modais
        function openModal(id) {
            var el = document.getElementById(id);
            if(el) el.style.display = 'flex';
        }

        function closeModal(id) {
            var el = document.getElementById(id);
            if(el) el.style.display = 'none';
        }

        function openMessagesModal() {
            openModal('modal-messages');
        }

        // 5. Ler os recados em tempo real (qualquer convidado novo que escreva aparece para todos!)
        db.collection("recados").orderBy("createdAt", "desc").onSnapshot(function(snapshot) {
            var messages = [];
            snapshot.forEach(function(doc) {
                messages.push(doc.data());
            });
            
            // Atualiza o contador de mensagens no botão
            var el = document.getElementById('msg-count');
            if(el) el.innerText = messages.length;

            // Atualiza a lista dentro do Modal
            var container = document.getElementById('messages-container');
            if(!container) return;
            
            if (messages.length === 0) {
                container.innerHTML = '<p style="font-size: 0.85rem; color: #888; padding: 15px;">Nenhum recado ainda. Seja o primeiro a escrever!</p>';
            } else {
                container.innerHTML = messages.map(function(m) {
                    return '<div class="msg-card">' +
                        '<div class="msg-header">' +
                            '<span>' + m.name + '</span>' +
                            '<span class="msg-time">' + m.time + '</span>' +
                        '</div>' +
                        '<div class="msg-body">"' + m.msg + '"</div>' +
                    '</div>';
                }).join('');
            }
        });

        // 6. Enviar um recado novo para o Firebase
        function sendRegistry(e) {
            e.preventDefault();
            var nameEl = document.getElementById('guest-name');
            var msgEl = document.getElementById('guest-msg');
            if(!nameEl || !msgEl) return;

            var name = nameEl.value;
            var msg = msgEl.value;
            var time = new Date().toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
            var timestamp = firebase.firestore.FieldValue.serverTimestamp(); // Grava a hora exata

            // Muda o botão para mostrar que está a carregar
            var btn = document.querySelector('.guest-message-form .btn-submit');
            var originalText = btn.innerText;
            btn.innerText = 'A enviar...';
            btn.disabled = true;

            // Guardar na base de dados
            db.collection("recados").add({
                name: name,
                msg: msg,
                time: time,
                createdAt: timestamp
            }).then(function() {
                alert('Obrigado pelo carinho, ' + name + '! A sua mensagem foi registada! ❤️');
                nameEl.value = '';
                msgEl.value = '';
                btn.innerText = originalText;
                btn.disabled = false;
            }).catch(function(error) {
                alert('Erro ao enviar. Tente novamente mais tarde.');
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }

        // 7. WhatsApp e Contagem Regressiva
        function confirmRSVP(e) {
            e.preventDefault();
            var name = document.getElementById('rsvp-name').value;
            var guests = document.getElementById('rsvp-guests').value;
            var phone = "5521987954278";
            var message = "Olá! Gostaria de confirmar a minha presença no Chá de Bebê da Lívia Sophia.\n\n*Nome:* " + name + "\n*Acompanhantes:* " + guests;
            window.open("https://api.whatsapp.com/send?phone=" + phone + "&text=" + encodeURIComponent(message), '_blank');
            closeModal('modal-rsvp');
        }

        function updateCountdown() {
            var eventDate = new Date('November 29, 2026 14:30:00').getTime();
            var now = new Date().getTime();
            var difference = eventDate - now;

            var dEl = document.getElementById('days');
            var hEl = document.getElementById('hours');
            var mEl = document.getElementById('mins');
            var sEl = document.getElementById('secs');

            if (!dEl || !hEl || !mEl || !sEl) return;

            if (difference > 0) {
                var days = Math.floor(difference / (1000 * 60 * 60 * 24));
                var hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                var minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                var seconds = Math.floor((difference % (1000 * 60)) / 1000);

                dEl.innerText = days < 10 ? '0' + days : days;
                hEl.innerText = hours < 10 ? '0' + hours : hours;
                mEl.innerText = minutes < 10 ? '0' + minutes : minutes;
                sEl.innerText = seconds < 10 ? '0' + seconds : seconds;
            } else {
                dEl.innerText = '00';
                hEl.innerText = '00';
                mEl.innerText = '00';
                sEl.innerText = '00';
            }
        }

        window.onload = function() {
            updateCountdown();
            setInterval(updateCountdown, 1000);
        };
    </script>
