    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa7c11;
            --bg-color: #faf8f5;
            --text-color: #5c5549;
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            background: linear-gradient(135deg, #fffdfa 0%, #f7f3ec 100%);
            min-height: 100vh;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container responsivo */
        .site-container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .star {
            color: #ebd18c;
            position: absolute;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* Ilustração */
        .hero-illustration {
            position: relative;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .bear-balloon-wrapper {
            width: 180px;
            height: 200px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Tipografia */
        .main-title {
            font-family: 'Caveat', cursive;
            font-size: 3.8rem;
            color: var(--gold-dark);
            line-height: 1.1;
        }

        .baby-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: #796851;
            font-weight: 700;
            margin: 5px 0 15px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .phrase {
            font-size: 1rem;
            color: #7a7367;
            margin: 0 auto 30px;
            max-width: 600px;
            line-height: 1.5;
            font-style: italic;
        }

        /* Bloco de Data e Hora */
        .date-time-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin: 25px 0;
        }

        .big-number {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--gold-dark);
            font-weight: 700;
            line-height: 1;
        }

        .label {
            font-size: 0.85rem;
            color: #8c8375;
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .divider-star { color: var(--gold-primary); font-size: 1.5rem; }

        /* Botões Principais */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 35px 0;
            flex-wrap: wrap;
        }

        .btn-circle-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            width: 120px;
        }

        .btn-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid var(--gold-primary);
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.15);
            transition: all 0.3s ease;
        }

        .btn-circle i { font-size: 1.6rem; color: var(--gold-dark); }

        .btn-circle-item:hover .btn-circle {
            transform: translateY(-5px);
            background-color: var(--gold-light);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }

        .btn-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #635b4f;
            margin-top: 10px;
            text-transform: uppercase;
            line-height: 1.2;
        }

        /* Contagem Regressiva */
        .section-box {
            background: transparent;
            border: none;
            padding: 10px;
            margin: 20px auto;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .time-card {
            background: #ffffff;
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #f0e6d2;
            min-width: 70px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .time-card .num { font-weight: 700; color: var(--gold-dark); font-size: 1.3rem; }
        .time-card .txt { font-size: 0.65rem; color: #8c8375; text-transform: uppercase; }

        /* Formulários e Botões nas Modais */
        .guest-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0d7c6;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            background: #faf8f5;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-submit:hover { opacity: 0.9; }

        /* Modais */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(3px);
